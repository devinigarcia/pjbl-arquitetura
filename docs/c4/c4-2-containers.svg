<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" width="1100" height="810" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="C4 — Nível 2: Diagrama de Containers"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="1100" height="810" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#12263a">C4 — Nível 2: Diagrama de Containers</text><text x="20" y="46" font-size="11.5" fill="#5b6b7c">Fluxo principal: Microfrontend → API Gateway → BFF → (ms-produtos, ms-pedidos, Azure Function). Linha tracejada = assíncrono (eventos)</text><path d="M115.0,167.0 L115.0,240.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="79.7" y="194.1" width="70.6" height="18.8" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="115" y="206.3" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Usa [HTTPS]</text><path d="M210.0,315.0 L320.0,315.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="227.0" y="292.9" width="76.1" height="44.3" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="265" y="305.1" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">JSON/HTTPS +</text><text x="265" y="317.8" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">subscription</text><text x="265" y="330.6" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">key</text><path d="M510.0,315.0 L620.0,315.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="515.9" y="299.3" width="98.1" height="31.5" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="565" y="311.4" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Repassa +</text><text x="565" y="324.2" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">x-gateway-secret</text><path d="M720.0,390.0 L720.0,470.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="659.9" y="414.3" width="120.2" height="31.5" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="720" y="426.4" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">POST /api/indicators</text><text x="720" y="439.2" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">[x-functions-key]</text><path d="M650.0,390.0 L650.0,430.0 L415.0,430.0 L415.0,470.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="483.4" y="420.6" width="98.1" height="18.8" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="532.5" y="432.8" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">REST [x-api-key]</text><path d="M820.0,315.0 L995.0,315.0 L995.0,470.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="858.4" y="305.6" width="98.1" height="18.8" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="907.5" y="317.8" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">REST [x-api-key]</text><path d="M415.0,610.0 L415.0,685.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="354.9" y="638.1" width="120.2" height="18.8" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="415" y="650.3" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Driver MongoDB [TLS]</text><path d="M995.0,610.0 L995.0,685.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="921.1" y="631.8" width="147.7" height="31.5" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="995" y="644.0" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">T-SQL: pedido + outbox na</text><text x="995" y="656.7" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">mesma transação</text><path d="M620.0,540.0 L510.0,540.0" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#seta)"/><rect x="518.7" y="517.9" width="92.6" height="44.3" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="565" y="530.1" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Registra a</text><text x="565" y="542.8" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">movimentação de</text><text x="565" y="555.6" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">estoque</text><path d="M900.0,580.0 L860.0,580.0 L860.0,732.0 L820.0,732.5" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#seta)"/><rect x="827.5" y="647.9" width="65.1" height="44.3" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="860" y="660.1" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Publica</text><text x="860" y="672.8" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">eventos de</text><text x="860" y="685.6" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">pedido</text><path d="M720.0,695.0 L720.0,610.0" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#seta)"/><rect x="679.2" y="643.1" width="81.6" height="18.8" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="720" y="655.3" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Queue Trigger</text><circle cx="115" cy="77" r="15" fill="#0b3d6e" stroke="#072a4d"/><rect x="20" y="88" width="190" height="79" rx="14" fill="#0b3d6e" stroke="#072a4d"/><text x="115" y="126.1" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Operador da loja</text><text x="115" y="140.9" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Pessoa]</text><rect x="20" y="240" width="190" height="150" rx="8" fill="#2f7fc8" stroke="#1f5f9c"/><text x="115" y="283.3" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Microfrontend</text><text x="115" y="298.2" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Container: React + Vite,</text><text x="115" y="311.2" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">Module Federation]</text><text x="115" y="332.2" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Shell + remotes de Produtos</text><text x="115" y="346.0" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">e Pedidos, no GitHub Pages.</text><text x="115" y="359.8" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Só conhece a URL do gateway.</text><rect x="320" y="240" width="190" height="150" rx="8" fill="#2f7fc8" stroke="#1f5f9c"/><text x="415" y="283.3" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">API Gateway</text><text x="415" y="298.2" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Container: Azure API</text><text x="415" y="311.2" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">Management (Consumption)]</text><text x="415" y="332.2" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Entrada única: subscription</text><text x="415" y="346.0" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">key, rate limit, CORS e</text><text x="415" y="359.8" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">x-gateway-secret.</text><rect x="620" y="240" width="200" height="150" rx="8" fill="#2f7fc8" stroke="#1f5f9c"/><text x="720" y="276.4" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">BFF</text><text x="720" y="291.3" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Container: Node.js + Express,</text><text x="720" y="304.3" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">Azure Container Apps]</text><text x="720" y="325.3" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">GET /aggregated-data,</text><text x="720" y="339.1" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">orquestra a criação de pedidos</text><text x="720" y="352.9" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">e faz proxy do CRUD. Sem</text><text x="720" y="366.8" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">banco.</text><rect x="320" y="470" width="190" height="140" rx="8" fill="#2f7fc8" stroke="#1f5f9c"/><text x="415" y="508.3" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">ms-produtos</text><text x="415" y="523.2" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Container: Node.js + Express,</text><text x="415" y="536.2" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">Azure Container Apps]</text><text x="415" y="557.2" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Produtos e movimentações de</text><text x="415" y="571.0" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">estoque (idempotentes por</text><text x="415" y="584.8" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">eventId).</text><rect x="620" y="470" width="200" height="140" rx="8" fill="#2f7fc8" stroke="#1f5f9c"/><text x="720" y="501.4" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Azure Function</text><text x="720" y="516.3" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Container: Node.js, Flex</text><text x="720" y="529.3" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">Consumption]</text><text x="720" y="550.3" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">HTTP Trigger: calcula</text><text x="720" y="564.1" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">indicadores. Queue Trigger:</text><text x="720" y="577.9" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">aplica eventos de pedido no</text><text x="720" y="591.8" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">estoque.</text><rect x="900" y="470" width="190" height="140" rx="8" fill="#2f7fc8" stroke="#1f5f9c"/><text x="995" y="515.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">ms-pedidos</text><text x="995" y="530.1" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Container: Node.js + Express,</text><text x="995" y="543.1" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">Azure Container Apps]</text><text x="995" y="564.1" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Pedidos, máquina de estados</text><text x="995" y="577.9" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">e Transactional Outbox.</text><path d="M320,694 a95,9 0 0 1 190,0 v77 a95,9 0 0 1 -190,0 z" fill="#2f7fc8" stroke="#1f5f9c"/><path d="M320,694 a95,9 0 0 0 190,0" fill="none" stroke="#1f5f9c"/><text x="415" y="730.6" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">MongoDB Atlas</text><text x="415" y="745.4" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Documentos: products,</text><text x="415" y="758.4" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">stock_movements]</text><path d="M630,695 h180 a10,37.5 0 0 1 0,75 h-180 a10,37.5 0 0 1 0,-75 z" fill="#2f7fc8" stroke="#1f5f9c"/><path d="M810,695 a10,37.5 0 0 0 0,75" fill="none" stroke="#1f5f9c"/><text x="720" y="731.1" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">order-events</text><text x="720" y="745.9" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Fila: Azure Storage Queue]</text><path d="M900,694 a95,9 0 0 1 190,0 v77 a95,9 0 0 1 -190,0 z" fill="#2f7fc8" stroke="#1f5f9c"/><path d="M900,694 a95,9 0 0 0 190,0" fill="none" stroke="#1f5f9c"/><text x="995" y="730.6" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Azure SQL Database</text><text x="995" y="745.4" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[SQL: Orders, OrderItems,</text><text x="995" y="758.4" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">OutboxMessages]</text><rect x="20" y="786" width="14" height="12" rx="2" fill="#0b3d6e" stroke="#072a4d"/><text x="39" y="796" font-size="10.5" fill="#44546a">Pessoa</text><rect x="86" y="786" width="14" height="12" rx="2" fill="#2f7fc8" stroke="#1f5f9c"/><text x="105" y="796" font-size="10.5" fill="#44546a">Container</text><rect x="170" y="786" width="14" height="12" rx="2" fill="#2f7fc8" stroke="#1f5f9c"/><text x="189" y="796" font-size="10.5" fill="#44546a">Banco de dados</text><rect x="284" y="786" width="14" height="12" rx="2" fill="#2f7fc8" stroke="#1f5f9c"/><text x="303" y="796" font-size="10.5" fill="#44546a">Fila</text></svg>