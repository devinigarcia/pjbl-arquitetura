er POST</text><text x="127.5" y="167.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">/api/indicators (authLevel</text><text x="127.5" y="180.8" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">function)</text><rect x="30" y="200" width="195" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="127.5" y="227.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">ProcessOrderEventEndpoint</text><text x="127.5" y="250.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">Queue Trigger da fila</text><text x="127.5" y="263.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">order-events</text><rect x="30" y="290" width="195" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="127.5" y="317.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">health / openapi / docs</text><text x="127.5" y="340.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">HTTP anônimo: /api/health,</text><text x="127.5" y="353.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">/api/docs</text><rect x="310" y="110" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="137.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">CalculateIndicatorsHandler</text><text x="415" y="160.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">valida a entrada e calcula os</text><text x="415" y="173.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">indicadores</text><rect x="310" y="200" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="227.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">ProcessOrderEventHandler</text><text x="415" y="250.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">evento → movimentações; decide</text><text x="415" y="263.9" font-si