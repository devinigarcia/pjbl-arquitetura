<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 879.7" width="1100" height="879.7" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Visão de runtime 2 — Criação de pedido e baixa de estoque por evento"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="1100" height="879.7" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#12263a">Visão de runtime 2 — Criação de pedido e baixa de estoque por evento</text><text x="20" y="46" font-size="11.5" fill="#5b6b7c">Parte síncrona (até o 201) e parte assíncrona (laranja): outbox → fila → Function → estoque</text><line x1="95" y1="114" x2="95" y2="861.7" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="26.16666666666667" y="70" width="137.66666666666666" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="95" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Microfrontend</text><line x1="246.66666666666666" y1="114" x2="246.66666666666666" y2="861.7" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="177.83333333333331" y="70" width="137.66666666666666" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="246.66666666666666" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">BFF (via gateway)</text><line x1="398.3333333333333" y1="114" x2="398.3333333333333" y2="861.7" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="329.5" y="70" width="137.66666666666666" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="398.3333333333333" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">ms-produtos</text><line x1="550" y1="114" x2="550" y2="861.7" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="481.1666666666667" y="70" width="137.66666666666666" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="550" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">ms-pedidos</text><line x1="701.6666666666666" y1="114" x2="701.6666666666666" y2="861.7" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="632.8333333333333" y="70" width="137.66666666666666" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="701.6666666666666" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Azure SQL</text><line x1="853.3333333333333" y1="114" x2="853.3333333333333" y2="861.7" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="784.4999999999999" y="70" width="137.66666666666666" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="853.3333333333333" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Fila order-events</text><line x1="1005" y1="114" x2="1005" y2="861.7" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="936.1666666666666" y="70" width="137.66666666666666" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="1005" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Azure Function</text><text x="170.83333333333331" y="138.0" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">1. POST /orders { cliente, itens:</text><text x="170.83333333333331" y="151.1" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">[productId, quantity] }</text><path d="M95,157.2 L246.66666666666666,157.2" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><text x="322.5" y="189.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">2. GET /products?ids=...</text><path d="M246.66666666666666,195.2 L398.3333333333333,195.2" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><text x="322.5" y="227.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">nome, preço e estoque oficiais</text><path d="M398.3333333333333,233.2 L246.66666666666666,233.2" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seta)"/><path d="M246.66666666666666,263.2 h34 v16 h-34" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><text x="288.66666666666663" y="275.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="start">confere estoque (409 se faltar)</text><text x="398.3333333333333" y="309.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">3. POST /orders (com nome e preço oficiais)</text><path d="M246.66666666666666,315.2 L550,315.2" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><text x="625.8333333333333" y="347.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">4. BEGIN; INSERT pedido + itens;</text><text x="625.8333333333333" y="360.3" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">INSERT OutboxMessages</text><text x="625.8333333333333" y="373.4" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">(order.created); COMMIT</text><path d="M550,379.59999999999997 L701.6666666666666,379.59999999999997" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><text x="398.3333333333333" y="411.6" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">201 pedido PENDENTE</text><path d="M550,417.59999999999997 L246.66666666666666,417.59999999999997" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seta)"/><text x="170.83333333333331" y="449.6" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">5. 201 { order, stock: { mode:</text><text x="170.83333333333331" y="462.7" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">&quot;event-driven&quot; } }</text><path d="M246.66666666666666,468.79999999999995 L95,468.79999999999995" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seta)"/><rect x="490" y="494.79999999999995" width="575" height="23.5" rx="4" fill="#fff8dc" stroke="#d8c56a"/><text x="777.5" y="508.8" font-size="10.5" font-weight="400" fill="#3d3a22" text-anchor="middle">A partir daqui é assíncrono. O relay do ms-pedidos é avisado logo após o commit.</text><text x="625.8333333333333" y="538.3" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">6. lê eventos pendentes do outbox</text><path d="M550,544.3 L701.6666666666666,544.3" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#seta)"/><text x="701.6666666666666" y="576.3" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">7. publica o evento (JSON em Base64)</text><path d="M550,582.3 L853.3333333333333,582.3" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#seta)"/><text x="625.8333333333333" y="614.3" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">marca ProcessedAt (status</text><text x="625.8333333333333" y="627.4" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">PUBLICADO)</text><path d="M550,633.5 L701.6666666666666,633.5" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#seta)"/><text x="929.1666666666666" y="665.5" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">8. Queue Trigger:</text><text x="929.1666666666666" y="678.6" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">processOrderEvent</text><path d="M853.3333333333333,684.7 L1005,684.7" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#seta)"/><text x="701.6666666666666" y="716.7" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">9. POST /products/{id}/stock-movements SAIDA, eventId = &quot;&lt;eventId&gt;:&lt;productId&gt;&quot;</text><path d="M1005,722.7 L398.3333333333333,722.7" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#seta)"/><text x="701.6666666666666" y="754.7" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">201 aplicado (ou 200 duplicate, se a mensagem for reentregue)</text><path d="M398.3333333333333,760.7 L1005,760.7" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seta)"/><rect x="490" y="786.7" width="575" height="37" rx="4" fill="#fff8dc" stroke="#d8c56a"/><text x="777.5" y="800.7" font-size="10.5" font-weight="400" fill="#3d3a22" text-anchor="middle">Cancelar o pedido segue o mesmo caminho com order.cancelled, e a Function registra uma ENTRADA</text><text x="777.5" y="814.1" font-size="10.5" font-weight="400" fill="#3d3a22" text-anchor="middle">(devolução).</text></svg>