<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="C4 — Nível 1: Diagrama de Contexto"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="1000" height="680" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#12263a">C4 — Nível 1: Diagrama de Contexto</text><text x="20" y="46" font-size="11.5" fill="#5b6b7c">Conecta Store: quem usa o sistema e com quais sistemas externos ele conversa</text><path d="M271.0,200.0 L396.6,285.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="224.4" y="226.8" width="158.7" height="31.5" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="303.8068181818182" y="238.9" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Gerencia produtos e pedidos</text><text x="303.8068181818182" y="251.7" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">pelo navegador [HTTPS]</text><path d="M729.0,200.0 L603.4,285.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="549.6" y="226.8" width="153.2" height="31.5" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="626.1931818181818" y="238.9" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Publica e acompanha (logs,</text><text x="626.1931818181818" y="251.7" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Swagger, health)</text><path d="M397.8,425.0 L259.0,520.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="232.8" y="456.8" width="131.2" height="31.5" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="298.37078651685397" y="468.9" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Lê e grava produtos</text><text x="298.37078651685397" y="481.7" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">[driver MongoDB / TLS]</text><path d="M500.0,425.0 L500.0,520.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="450.9" y="463.1" width="98.1" height="18.8" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="500" y="475.3" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Baixa as imagens</text><path d="M741.0,520.0 L602.2,425.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="647.1" y="456.8" width="109.1" height="31.5" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="701.629213483146" y="468.9" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Entrega o front e</text><text x="701.629213483146" y="481.7" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">dispara os deploys</text><path d="M710.0,577.5 L615.0,577.5" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="632.7" y="555.4" width="59.6" height="44.3" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="662.5" y="567.6" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">Publica</text><text x="662.5" y="580.3" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">imagens</text><text x="662.5" y="593.1" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">(Actions)</text><path d="M885.0,200.0 L885.0,520.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="858.0" y="350.6" width="54.1" height="18.8" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="885" y="362.8" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">git push</text><circle cx="175" cy="85" r="15" fill="#0b3d6e" stroke="#072a4d"/><rect x="60" y="96" width="230" height="104" rx="14" fill="#0b3d6e" stroke="#072a4d"/><text x="175" y="122.8" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Operador da loja</text><text x="175" y="137.7" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Pessoa]</text><text x="175" y="158.7" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Cadastra produtos, controla o</text><text x="175" y="172.5" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">estoque e registra os pedidos dos</text><text x="175" y="186.3" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">clientes.</text><circle cx="825" cy="85" r="15" fill="#0b3d6e" stroke="#072a4d"/><rect x="710" y="96" width="230" height="104" rx="14" fill="#0b3d6e" stroke="#072a4d"/><text x="825" y="129.7" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Equipe do projeto</text><text x="825" y="144.6" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Pessoa]</text><text x="825" y="165.6" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Alunos que desenvolvem, publicam e</text><text x="825" y="179.4" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">monitoram a solução.</text><rect x="340" y="285" width="320" height="140" rx="8" fill="#1565b0" stroke="#0e4a85"/><text x="500" y="329.8" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Conecta Store</text><text x="500" y="344.7" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Sistema de software]</text><text x="500" y="365.7" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Gestão de produtos, estoque e pedidos. Aplicação</text><text x="500" y="379.5" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">distribuída: microfrontend, API Gateway, BFF, dois</text><text x="500" y="393.3" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">microserviços e Azure Function.</text><rect x="60" y="520" width="230" height="115" rx="8" fill="#8c8c8c" stroke="#6b6b6b"/><text x="175" y="545.4" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">MongoDB Atlas</text><text x="175" y="560.3" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Sistema externo]</text><text x="175" y="581.3" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Banco de documentos gerenciado</text><text x="175" y="595.1" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">(camada gratuita M0). Guarda</text><text x="175" y="608.9" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">produtos e movimentações de</text><text x="175" y="622.8" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">estoque.</text><rect x="385" y="520" width="230" height="115" rx="8" fill="#8c8c8c" stroke="#6b6b6b"/><text x="500" y="559.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Docker Hub</text><text x="500" y="574.1" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Sistema externo]</text><text x="500" y="595.1" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Registro público das imagens do BFF</text><text x="500" y="608.9" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">e dos dois microserviços.</text><rect x="710" y="520" width="230" height="115" rx="8" fill="#8c8c8c" stroke="#6b6b6b"/><text x="825" y="545.4" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">GitHub</text><text x="825" y="560.3" font-size="10" font-weight="400" fill="#ffffff" text-anchor="middle">[Sistema externo]</text><text x="825" y="581.3" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Repositórios públicos, GitHub</text><text x="825" y="595.1" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">Actions (testes e build das</text><text x="825" y="608.9" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">imagens) e GitHub Pages (hospeda o</text><text x="825" y="622.8" font-size="10.8" font-weight="400" fill="#ffffff" text-anchor="middle">front).</text><rect x="20" y="656" width="14" height="12" rx="2" fill="#0b3d6e" stroke="#072a4d"/><text x="39" y="666" font-size="10.5" fill="#44546a">Pessoa</text><rect x="86" y="656" width="14" height="12" rx="2" fill="#1565b0" stroke="#0e4a85"/><text x="105" y="666" font-size="10.5" fill="#44546a">Sistema</text><rect x="158" y="656" width="14" height="12" rx="2" fill="#8c8c8c" stroke="#6b6b6b"/><text x="177" y="666" font-size="10.5" fill="#44546a">Sistema externo</text></svg>