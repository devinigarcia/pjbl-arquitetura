<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 726.1000000000001" width="1000" height="726.1000000000001" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Visão de runtime 1 — GET /aggregated-data"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="1000" height="726.1000000000001" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#12263a">Visão de runtime 1 — GET /aggregated-data</text><text x="20" y="46" font-size="11.5" fill="#5b6b7c">O dashboard pede tudo de uma vez; o BFF consulta os dois microserviços em paralelo e depois a Function</text><line x1="95" y1="114" x2="95" y2="708.1000000000001" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="21" y="70" width="148" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="95" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Microfrontend</text><line x1="257" y1="114" x2="257" y2="708.1000000000001" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="183" y="70" width="148" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="257" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">API Gateway</text><line x1="419" y1="114" x2="419" y2="708.1000000000001" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="345" y="70" width="148" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="419" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">BFF</text><line x1="581" y1="114" x2="581" y2="708.1000000000001" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="507" y="70" width="148" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="581" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">ms-produtos</text><line x1="743" y1="114" x2="743" y2="708.1000000000001" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="669" y="70" width="148" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="743" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">ms-pedidos</text><line x1="905" y1="114" x2="905" y2="708.1000000000001" stroke="#9aa5b1" stroke-dasharray="4 4"/><rect x="831" y="70" width="148" height="44" rx="6" fill="#2f7fc8" stroke="#1f5f9c"/><text x="905" y="96.0" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Azure Function</text><text x="176" y="138.0" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">1. GET /aggregated-data +</text><text x="176" y="151.1" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">Ocp-Apim-Subscription-Key</text><path d="M95,157.2 L257,157.2" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><path d="M257,187.2 h34 v16 h-34" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><text x="299" y="199.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="start">valida a chave, aplica rate limit</text><text x="338" y="233.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">2. repassa com x-gateway-secret</text><path d="M257,239.2 L419,239.2" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><rect x="359" y="265.2" width="444" height="37" rx="4" fill="#fff8dc" stroke="#d8c56a"/><text x="581" y="279.2" font-size="10.5" font-weight="400" fill="#3d3a22" text-anchor="middle">O BFF gera (ou reaproveita) o x-correlation-id e dispara as duas consultas</text><text x="581" y="292.6" font-size="10.5" font-weight="400" fill="#3d3a22" text-anchor="middle">ao mesmo tempo</text><text x="500" y="322.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">3. GET /products?pageSize=100</text><path d="M419,328.2 L581,328.2" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><text x="581" y="360.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">3. GET /orders?pageSize=100 e GET /events?limit=10</text><path d="M419,366.2 L743,366.2" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><text x="500" y="398.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">produtos (MongoDB)</text><path d="M581,404.2 L419,404.2" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seta)"/><text x="581" y="436.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">pedidos + eventos (Azure SQL)</text><path d="M743,442.2 L419,442.2" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seta)"/><text x="662" y="474.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">4. POST /api/indicators { products, orders } + x-functions-key</text><path d="M419,480.2 L905,480.2" fill="none" stroke="#374151" stroke-width="1.4" marker-end="url(#seta)"/><text x="662" y="512.2" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">indicadores, top produtos e alertas</text><path d="M905,518.2 L419,518.2" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seta)"/><rect x="359" y="544.2" width="606" height="23.5" rx="4" fill="#fff8dc" stroke="#d8c56a"/><text x="662" y="558.2" font-size="10.5" font-weight="400" fill="#3d3a22" text-anchor="middle">Se uma fonte falhar, o BFF não devolve erro: marca partial = true e segue com o que conseguiu</text><text x="338" y="587.7" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">5. 200 — JSON único +</text><text x="338" y="600.8" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">Server-Timing + x-correlation-id</text><path d="M419,606.9000000000001 L257,606.9000000000001" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seta)"/><text x="176" y="638.9" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">200 (cabeçalhos expostos via</text><text x="176" y="652.0" font-size="10.5" font-weight="400" fill="#1f2937" text-anchor="middle">CORS)</text><path d="M257,658.1000000000001 L95,658.1000000000001" fill="none" stroke="#374151" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#seta)"/></svg>