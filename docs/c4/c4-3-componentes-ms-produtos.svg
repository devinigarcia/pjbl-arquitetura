<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 673" width="1100" height="673" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="C4 — Nível 3: Componentes do ms-produtos"><defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs><rect width="1100" height="673" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#12263a">C4 — Nível 3: Componentes do ms-produtos</text><text x="20" y="46" font-size="11.5" fill="#5b6b7c">O estoque só muda por movimentação; cada movimentação pode levar um eventId para ser idempotente</text><rect x="20" y="68" width="215" height="396" rx="6" fill="#eef4fb" stroke="#9db7d3" stroke-dasharray="6 4"/><text x="30" y="86.0" font-size="12.5" font-weight="700" fill="#1e3550" text-anchor="start">API</text><text x="30" y="102.0" font-size="10.5" font-weight="400" fill="#4a6078" text-anchor="start" font-style="italic">adaptadores de entrada</text><rect x="300" y="68" width="230" height="396" rx="6" fill="#eef4fb" stroke="#9db7d3" stroke-dasharray="6 4"/><text x="310" y="86.0" font-size="12.5" font-weight="700" fill="#1e3550" text-anchor="start">Application</text><text x="310" y="102.0" font-size="10.5" font-weight="400" fill="#4a6078" text-anchor="start" font-style="italic">casos de uso (slices) e portas</text><rect x="610" y="68" width="220" height="216" rx="6" fill="#eef4fb" stroke="#9db7d3" stroke-dasharray="6 4"/><text x="620" y="86.0" font-size="12.5" font-weight="700" fill="#1e3550" text-anchor="start">Domain</text><text x="620" y="102.0" font-size="10.5" font-weight="400" fill="#4a6078" text-anchor="start" font-style="italic">regras puras, sem pacotes</text><rect x="610" y="308" width="220" height="306" rx="6" fill="#eef4fb" stroke="#9db7d3" stroke-dasharray="6 4"/><text x="620" y="326.0" font-size="12.5" font-weight="700" fill="#1e3550" text-anchor="start">Infrastructure</text><text x="620" y="342.0" font-size="10.5" font-weight="400" fill="#4a6078" text-anchor="start" font-style="italic">implementa as portas</text><path d="M235.0,150.0 L300.0,150.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="240.5" y="134.3" width="54.1" height="31.5" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="267.5" y="146.4" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">chama os</text><text x="267.5" y="159.2" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">handlers</text><path d="M530.0,150.0 L610.0,150.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="556.7" y="140.6" width="26.5" height="18.8" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="570" y="152.8" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">usa</text><path d="M610.0,370.0 L530.0,370.0" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#seta)"/><rect x="537.5" y="354.3" width="65.1" height="31.5" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="570" y="366.4" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">implementa</text><text x="570" y="379.2" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">as portas</text><path d="M818.0,389.0 L885.0,389.0" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#seta)"/><rect x="830.0" y="379.6" width="43.0" height="18.8" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="851.5" y="391.8" font-size="10.2" font-weight="400" fill="#1f2937" text-anchor="middle">driver</text><rect x="30" y="110" width="195" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="127.5" y="137.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Middlewares</text><text x="127.5" y="160.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">correlationId, apiKey</text><text x="127.5" y="173.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">(x-api-key), errorHandler</text><rect x="30" y="200" width="195" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="127.5" y="220.3" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Endpoints de produto</text><text x="127.5" y="243.2" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">CreateProduct, ListProducts,</text><text x="127.5" y="257.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">GetProduct, UpdateProduct,</text><text x="127.5" y="270.8" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">DeleteProduct</text><rect x="30" y="290" width="195" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="127.5" y="317.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Endpoints de estoque</text><text x="127.5" y="340.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">RegisterStockMovement,</text><text x="127.5" y="353.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">ListStockMovements</text><rect x="30" y="380" width="195" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="127.5" y="414.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">OpenAPI + Swagger UI</text><text x="127.5" y="437.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">/docs e /openapi.json</text><rect x="310" y="110" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="137.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Handlers de produto</text><text x="415" y="160.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">Create, List, Get, Update,</text><text x="415" y="173.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">Delete</text><rect x="310" y="200" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="227.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">RegisterStockMovementHandler</text><text x="415" y="250.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">201 aplica, 200 se o eventId já</text><text x="415" y="263.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">foi usado, 409 sem saldo</text><rect x="310" y="290" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="324.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">ListStockMovementsHandler</text><text x="415" y="347.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">histórico do produto</text><rect x="310" y="380" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="407.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Portas</text><text x="415" y="430.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">ProductRepository,</text><text x="415" y="443.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">StockMovementRepository</text><rect x="622" y="110" width="196" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="720" y="137.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Product</text><text x="720" y="160.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">SKU, preço, estoque, lowStock</text><text x="720" y="173.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">(≤ 5)</text><rect x="622" y="200" width="196" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="720" y="227.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">StockMovement / errors</text><text x="720" y="250.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">ENTRADA, SAIDA, saldo após a</text><text x="720" y="263.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">movimentação</text><rect x="622" y="350" width="196" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="720" y="370.3" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Repositórios MongoDB</text><text x="720" y="393.2" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">índice único de SKU e de</text><text x="720" y="407.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">eventId; baixa atômica com</text><text x="720" y="420.8" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">$inc condicional</text><rect x="622" y="440" width="196" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="720" y="467.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Repositórios em memória</text><text x="720" y="490.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">mesmo contrato, para testes e</text><text x="720" y="503.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">demonstração local</text><rect x="622" y="530" width="196" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="720" y="564.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">config / logger</text><text x="720" y="587.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">variáveis de ambiente; pino</text><path d="M885,359 a97.5,9 0 0 1 195,0 v60 a97.5,9 0 0 1 -195,0 z" fill="#2f7fc8" stroke="#1f5f9c"/><path d="M885,359 a97.5,9 0 0 0 195,0" fill="none" stroke="#1f5f9c"/><text x="982.5" y="400.1" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">MongoDB Atlas</text></svg>