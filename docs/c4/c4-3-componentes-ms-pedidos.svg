chor="middle">/docs, /events/docs,</text><text x="127.5" y="443.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">/events/asyncapi.yaml</text><rect x="310" y="110" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="137.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">CreateOrderHandler</text><text x="415" y="160.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">cria o pedido e grava</text><text x="415" y="173.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">order.created no outbox</text><rect x="310" y="200" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="220.3" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">ChangeOrderStatusHandler</text><text x="415" y="243.2" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">transição + concorrência</text><text x="415" y="257.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">otimista; cancelar grava</text><text x="415" y="270.8" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">order.cancelled</text><rect x="310" y="290" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="310.3" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Demais handlers</text><text x="415" y="333.2" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">List, Get, Update, Delete,</text><text x="415" y="347.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">ListOrderEvents,</text><text x="415" y="360.8" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">DispatchOrderEvents</text><rect x="310" y="380" width="210" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="415" y="400.3" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Portas</text><text x="415" y="423.2" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">OrderRepository,</text><text x="415" y="437.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">OutboxRepository,</text><text x="415" y="450.8" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">EventPublisher, sinal do relay</text><rect x="622" y="110" width="196" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="720" y="137.2" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Order (agregado)</text><text x="720" y="160.1" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">itens, total, máquina de</text><text x="720" y="173.9" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">estados, pullEvents()</text><rect x="622" y="200" width="196" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="720" y="220.3" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">OrderEvent / errors</text><text x="720" y="243.2" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">order.created,</text><text x="720" y="257.0" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">order.cancelled; erros de</text><text x="720" y="270.8" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">regra</text><rect x="622" y="350" width="196" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><text x="720" y="368.8" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">Repositório SQL +</text><text x="720" y="385.7" font-size="13.5" font-weight="700" fill="#12263a" text-anchor="middle">migração</text><text x="720" y="408.6" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">mssql; transação pedido +</text><text x="720" y="422.4" font-size="10.8" font-weight="400" fill="#12263a" text-anchor="middle">outbox; retry de conexão</text><rect x="622" y="440" width="196" height="78" rx="8" fill="#a9d0f5" stroke="#5b9bd5"/><t